<main><h1>Two read-only review paths</h1><p>The existing host loop executes the work. These adapters inspect its saved evidence.</p>

<title id="observable-learning-map-title">Two read-only review paths</title>
<desc id="observable-learning-map-desc">Saved runs pass through the existing comparator into a review report. One outcome ledger passes through a scoped metadata adapter into the pinned Agent Flow UI. Neither path activates a candidate.</desc>
